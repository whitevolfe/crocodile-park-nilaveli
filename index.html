<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Crocodile Park Nilaveli - Wild Crocodile & Sunset Wildlife Experience in Sri Lanka" />

    <!-- Website Logo - Favicon (Browser Tab Image) -->
    <link rel="icon" type="image/png" href="/crocodile-parklogo.png" />
    <link rel="apple-touch-icon" href="/crocodile-parklogo.png" />

    <!-- Open Graph / Social Browser Image -->
    <meta property="og:title" content="Crocodile Park Nilaveli | Wild Crocodile & Sunset Wildlife Experience" />
    <meta property="og:description" content="Experience wild crocodiles, bird watching, and beautiful sunsets at Crocodile Park Nilaveli, Sri Lanka." />

    <meta property="og:url" content="https://crocodileparknilaveli.com" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Crocodile Park Nilaveli | Wild Crocodile & Sunset Wildlife Experience" />
    <meta name="twitter:description" content="Experience wild crocodiles, bird watching, and beautiful sunsets at Crocodile Park Nilaveli, Sri Lanka." />

    <title>Crocodile Park Nilaveli | Wild Crocodile & Sunset Wildlife Experience</title>
  </head>

  <body>
    <div id="root"></div>

    <!-- Google Translate hidden container -->
    <div
      id="google_translate_element"
      style="position: absolute; width: 1px; height: 1px; overflow: hidden"
    ></div>

    <script>
      function googleTranslateElementInit() {
        new google.translate.TranslateElement(
          {
            pageLanguage: "en",
            includedLanguages: "en,de,fr,es,ru,nl,it,cs,hr,be",
            autoDisplay: false,
          },
          "google_translate_element",
        );
      }
    </script>

    <script src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>

    <script type="module" src="/src/main.tsx"></script>
  </body>
